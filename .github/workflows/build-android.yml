name: Android Build & Release

# Same flow as the CLI app: push to main (or run manually) -> build a signed
# AAB on GitHub's runner -> upload to Google Play. No Expo/EAS servers:
# `expo prebuild` only GENERATES android/ locally on the runner, then plain
# Gradle builds it, exactly like before.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal / alpha / beta / production)"
        required: false
        default: ""

env:
  # Default Play track for pushes to main.
  # ⚠️ "internal" while the Expo rebuild is new: a merge lands in Internal
  # testing first, you check it on your phone, then promote it to Production
  # in Play Console (or change this to production once you trust the
  # pipeline). The CLI app used production + completed.
  PLAY_TRACK: internal

jobs:
  android-build:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Expo SDK 57 needs Node 20.19+
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      # Generates android/ from app.config.ts + plugins (CNG). Same output
      # as `npm run prebuild` on your Mac. BUILD_NUMBER feeds versionCode
      # (run_number + 11, identical to the CLI app's numbering).
      - name: Expo prebuild (generate android/)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      # --- KEYSTORE DECODING (after prebuild: prebuild --clean wipes android/) ---
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Release Bundle (AAB)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # Read by plugins/withEzySplitSigning.js (path is relative to android/app)
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.techtitens.ezysplit
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || env.PLAY_TRACK }}
          status: completed
          # Edit distribution/whatsnew/whatsnew-en-US before every release.
          whatsNewDirectory: distribution/whatsnew

      - name: Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
