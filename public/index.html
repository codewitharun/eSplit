<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover + black-translucent: the Home Screen app fills the
         whole screen (no white bars); the app's safe-area insets keep content
         clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EzySplit" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- scope "/" keeps every page (Home, Groups, Settings) inside the Home Screen
         app; without it iOS takes the scope from the page you added it on. -->
    <link rel="manifest" href="/manifest.json" />
    <title>EzySplit</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0a0f1c;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
